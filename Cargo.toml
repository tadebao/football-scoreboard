[package]
name = "football-scoreboard"
version = "0.2.0"
edition = "2021"
description = "足球比分大屏展示系统 PoC：原生桌面单 EXE，控制台窗口 + 大屏窗口，时间戳计时 + JSON 持久化"

[dependencies]
eframe = "0.29"
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-resource = "2.5"

[profile.release]
strip = true
